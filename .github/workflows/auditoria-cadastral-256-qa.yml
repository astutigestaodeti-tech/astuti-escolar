name: Auditoria cadastral isolada 256 - concorrência PostgreSQL
on:
  push:
    branches: [qa/auditoria-concorrencia-256]
permissions:
  contents: read
jobs:
  concorrencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_user
          POSTGRES_DB: postgres
          POSTGRES_USER: astuti_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astuti_ci -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLATFORM_DB_HOST: 127.0.0.1
      PLATFORM_DB_PORT: '5432'
      PLATFORM_DB_DATABASE: astuti_platform_test
      PLATFORM_DB_USERNAME: astuti_ci
      PLATFORM_DB_PASSWORD: ci_only_user
      TENANCY_INTEGRATION: '1'
      TENANCY_TEST_DB_HOST: 127.0.0.1
      TENANCY_TEST_DB_PORT: '5432'
      TENANCY_TEST_DB_A: astuti_tenant_a_test
      TENANCY_TEST_DB_B: astuti_tenant_b_test
      TENANCY_TEST_DB_USER: astuti_ci
      TENANCY_TEST_DB_PASSWORD: ci_only_user

    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 18c42e34528d450e7fe6c066a8b677bd2480e6cd
          path: app
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, gd, exif
          coverage: none
      - name: Preparar bancos e fixture exclusivamente descartáveis
        run: |
          test "$(git rev-parse HEAD)" = "18c42e34528d450e7fe6c066a8b677bd2480e6cd"
          for database in astuti_platform_test astuti_tenant_a_test astuti_tenant_b_test; do
            PGPASSWORD=ci_only_user psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U astuti_ci -d postgres -c "CREATE DATABASE $database WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"
          done
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
          cp ../harness/qa/auditoria-256/AuditBrowserFixtureTest.php tests/Feature/Students/
          php artisan test --filter=AuditBrowserFixtureTest
          cp ../harness/qa/auditoria-256/tenancy.php config/tenancy.php
      - name: Conflitos reais de CPF e RA em conexões independentes
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
        run: php ../harness/qa/auditoria-256/concurrency.php
