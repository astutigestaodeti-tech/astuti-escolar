name: Testes Laravel

on:
  pull_request:
    branches:
      - main
      # PRs empilhados: a base de cada PR e a branch do PR anterior.
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes PHP e interface
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_user
          POSTGRES_DB: postgres
          POSTGRES_USER: astuti_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astuti_ci -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLATFORM_DB_HOST: 127.0.0.1
      PLATFORM_DB_PORT: '5432'
      PLATFORM_DB_DATABASE: astuti_platform_test
      PLATFORM_DB_USERNAME: astuti_ci
      PLATFORM_DB_PASSWORD: ci_only_user
      TENANCY_INTEGRATION: '1'
      TENANCY_TEST_DB_HOST: 127.0.0.1
      TENANCY_TEST_DB_PORT: '5432'
      TENANCY_TEST_DB_A: astuti_tenant_a_test
      TENANCY_TEST_DB_B: astuti_tenant_b_test
      TENANCY_TEST_DB_USER: astuti_ci
      TENANCY_TEST_DB_PASSWORD: ci_only_user

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Testar seguranca do ensaio de restauracao PostgreSQL
        run: bash tests/Shell/EnsaiarRestauracaoPostgresqlTest.sh

      - name: Testar backup pre-copia PostgreSQL
        run: bash tests/Shell/CriarBackupsPreCopiaTest.sh

      - name: Testar copia ficticia em PostgreSQL isolado
        run: bash tests/Shell/EnsaiarCopiaIsoladaPostgresqlTest.sh

      - name: Testar abertura segura do login PostgreSQL isolado
        run: bash tests/Shell/TestarLoginIsoladoPostgresqlTest.sh

      - name: Instalar leitor de documentos (OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-por poppler-utils
          tesseract --list-langs | grep -qx por

      - name: Preparar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, gd, exif
          coverage: none

      - name: Conferir ambiente
        run: |
          php -v
          composer --version
          php -m | grep -Ei 'pdo_pgsql|pdo_sqlite|mbstring'

      - name: Preparar bancos descartaveis
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U astuti_ci -d postgres -c "CREATE DATABASE astuti_platform_test WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U astuti_ci -d postgres -c "CREATE DATABASE astuti_tenant_a_test WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U astuti_ci -d postgres -c "CREATE DATABASE astuti_tenant_b_test WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente de testes
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Conferir estilo PHP
        run: |
          if ! vendor/bin/pint --test; then
            vendor/bin/pint
            git diff -- app/Http/Controllers/ClassYearEndController.php database/migrations/tenant/2026_11_23_000036_create_class_year_results.php
            exit 1
          fi

      - name: Executar testes
        run: |
          php artisan test
          php artisan test

      - name: Preparar Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias da interface
        run: npm ci

      - name: Compilar interface
        run: npm run build

      - name: Verificar identidade visual
        run: npm run test:ui

  permissoes-producao:
    name: PostgreSQL 17 como usuario web restrito
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: astuti_roles_ci_admin
          POSTGRES_PASSWORD: roles_ci_admin_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astuti_roles_ci_admin -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      ASTUTI_PG_ROLE_INTEGRATION: '1'
      SESSION_DRIVER: database
      SESSION_CONNECTION: platform
      CACHE_STORE: database
      DB_CACHE_CONNECTION: platform
      ASTUTI_PG_ADMIN_HOST: 127.0.0.1
      ASTUTI_PG_ADMIN_PORT: '5432'
      ASTUTI_PG_ADMIN_USER: astuti_roles_ci_admin
      ASTUTI_PG_ADMIN_PASSWORD: roles_ci_admin_only
      ASTUTI_PG_TEST_MIGRATION_PASSWORD: roles_ci_migration_only
      ASTUTI_PG_TEST_APPLICATION_PASSWORD: roles_ci_web_only
      PLATFORM_DB_HOST: 127.0.0.1
      PLATFORM_DB_PORT: '5432'
      PLATFORM_DB_DATABASE: astuti_roles_platform_test
      PLATFORM_DB_USERNAME: astuti_migracao
      PLATFORM_DB_PASSWORD: roles_ci_migration_only
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: '5432'
      TENANT_DB_DATABASE: astuti_roles_tenant_test
      TENANT_DB_USERNAME: astuti_migracao
      TENANT_DB_PASSWORD: roles_ci_migration_only

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, gd, exif
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar chaves descartaveis
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Criar bancos PostgreSQL 17 ICU pt-BR
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U astuti_roles_ci_admin -d postgres -c "CREATE DATABASE astuti_roles_platform_test WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U astuti_roles_ci_admin -d postgres -c "CREATE DATABASE astuti_roles_tenant_test WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"

      - name: Provisionar papeis com o comando versionado
        run: php artisan astuti:permissoes-pg --confirmar=PERMISSOES-PG

      - name: Definir senhas exclusivas e ficticias de CI
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U astuti_roles_ci_admin -d postgres -c "ALTER ROLE astuti_migracao PASSWORD 'roles_ci_migration_only';"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U astuti_roles_ci_admin -d postgres -c "ALTER ROLE astuti_aplicacao PASSWORD 'roles_ci_web_only';"

      - name: Testar recusas SQL, login e escrita auditada
        run: |
          php artisan test --filter=PostgresProductionRolesTest
          php artisan test --filter=PostgresProductionRolesTest

  migracao-integracao:
    name: Integração MariaDB para PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: astuti_migration_ci
          POSTGRES_PASSWORD: astuti_migration_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astuti_migration_ci -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: astuti_migration_ci_only
          MARIADB_DATABASE: astuti_migration_maria_admin_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ASTUTI_MIGRATION_INTEGRATION: '1'
      ASTUTI_MIGRATION_MARIADB_HOST: 127.0.0.1
      ASTUTI_MIGRATION_MARIADB_PORT: '3307'
      ASTUTI_MIGRATION_MARIADB_ADMIN_DB: astuti_migration_maria_admin_test
      ASTUTI_MIGRATION_MARIADB_USER: root
      ASTUTI_MIGRATION_MARIADB_PASSWORD: astuti_migration_ci_only
      ASTUTI_MIGRATION_POSTGRES_HOST: 127.0.0.1
      ASTUTI_MIGRATION_POSTGRES_PORT: '5432'
      ASTUTI_MIGRATION_POSTGRES_ADMIN_DB: astuti_migration_pg_admin_test
      ASTUTI_MIGRATION_POSTGRES_USER: astuti_migration_ci
      ASTUTI_MIGRATION_POSTGRES_PASSWORD: astuti_migration_ci_only
      ASTUTI_MIGRATION_SOURCE_PLATFORM_DB: astuti_migration_source_platform_test
      ASTUTI_MIGRATION_SOURCE_TENANT_DB: astuti_migration_source_tenant_test
      ASTUTI_MIGRATION_TARGET_PLATFORM_DB: astuti_migration_target_platform_test
      ASTUTI_MIGRATION_TARGET_TENANT_DB: astuti_migration_target_tenant_test

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, pdo_mysql, gd, exif
          coverage: none

      - name: Conferir drivers MariaDB e PostgreSQL
        run: |
          php -r 'exit(extension_loaded("pdo_mysql") && extension_loaded("pdo_pgsql") ? 0 : 1);'

      - name: Preparar banco administrativo PostgreSQL pt-BR
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U astuti_migration_ci -d postgres -c "CREATE DATABASE astuti_migration_pg_admin_test WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente de testes
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Executar integração da migração (1ª rodada)
        run: php artisan test --filter=MigrateFictitiousDataToPostgresTest

      - name: Repetir integração da migração (2ª rodada)
        env:
          ASTUTI_MIGRATION_SOURCE_PLATFORM_DB: astuti_migration_source_platform_r2_test
          ASTUTI_MIGRATION_SOURCE_TENANT_DB: astuti_migration_source_tenant_r2_test
          ASTUTI_MIGRATION_TARGET_PLATFORM_DB: astuti_migration_target_platform_r2_test
          ASTUTI_MIGRATION_TARGET_TENANT_DB: astuti_migration_target_tenant_r2_test
        run: php artisan test --filter=MigrateFictitiousDataToPostgresTest
