name: Testes Laravel

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    name: Testes PHP e interface
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Conferir ambiente
        run: |
          php -v
          composer --version
          php -m | grep -Ei 'pdo_sqlite|mbstring'

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente de testes
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Executar testes
        run: php artisan test

      - name: Conferir estilo PHP
        run: vendor/bin/pint --test

      - name: Preparar Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias da interface
        run: npm ci

      - name: Compilar interface
        run: npm run build
