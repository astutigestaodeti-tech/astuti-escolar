name: Ensaio isolado de layout cadastral 313

on:
  push:
    branches: [qa/layout-fase2-290-292]

permissions:
  contents: read

jobs:
  renderizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: a0ee43a7997993a2bd0989b3ad5c0e31c118d02f
            pr: '313'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_user
          POSTGRES_DB: postgres
          POSTGRES_USER: astuti_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astuti_ci -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLATFORM_DB_HOST: 127.0.0.1
      PLATFORM_DB_PORT: '5432'
      PLATFORM_DB_DATABASE: astuti_platform_test
      PLATFORM_DB_USERNAME: astuti_ci
      PLATFORM_DB_PASSWORD: ci_only_user
      TENANCY_INTEGRATION: '1'
      TENANCY_TEST_DB_HOST: 127.0.0.1
      TENANCY_TEST_DB_PORT: '5432'
      TENANCY_TEST_DB_A: astuti_tenant_a_test
      TENANCY_TEST_DB_B: astuti_tenant_b_test
      TENANCY_TEST_DB_USER: astuti_ci
      TENANCY_TEST_DB_PASSWORD: ci_only_user

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, gd, exif
          coverage: none

      - name: Preparar dados de teste
        shell: bash
        run: |
          for database in astuti_platform_test astuti_tenant_a_test astuti_tenant_b_test; do
            PGPASSWORD=ci_only_user psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U astuti_ci -d postgres -c "CREATE DATABASE $database WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"
          done
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force

      - name: Confirmar SHA e renderizar telas fictícias
        shell: bash
        env:
          TARGET_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "${RUNNER_TEMP}/astuti-telas" "${RUNNER_TEMP}/astuti-alvo"
          ASTUTI_DUMP_TELAS="${RUNNER_TEMP}/astuti-telas" php artisan test --filter=SchoolStudentIndexTest
          ASTUTI_DUMP_TELAS="${RUNNER_TEMP}/astuti-telas" php artisan test --filter=test_lista_filtrada_transporte_dois_anos_abre_e_renderiza_vinculo_correto
          for name in alunos_transporte_usa alunos_transporte_adaptado alunos_transporte_nao_solicitado; do
            test -s "${RUNNER_TEMP}/astuti-telas/$name.html"
            cp "${RUNNER_TEMP}/astuti-telas/$name.html" "${RUNNER_TEMP}/astuti-alvo/"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir matrícula exibida e margens reais em Chromium
        shell: bash
        run: |
          python -m pip install 'playwright==1.51.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root = Path(os.environ['RUNNER_TEMP'], 'astuti-alvo')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in (1440, 390):
                  page = browser.new_page(viewport={'width': width, 'height': 900})
                  for filtro in ('usa', 'adaptado', 'nao_solicitado'):
                      page.goto((root / f'alunos_transporte_{filtro}.html').as_uri())
                      linha = page.get_by_role('row').filter(has_text='Ana Fictícia Dois Anos')
                      assert linha.count() == 1
                      if filtro == 'nao_solicitado':
                          assert linha.get_by_text('Não solicitado', exact=True).count() == 1
                          assert linha.get_by_text('Linha Fictícia de 2026', exact=False).count() == 0
                      else:
                          assert linha.get_by_text('Usa transporte', exact=True).count() == 1
                          assert linha.get_by_text('Linha Fictícia de 2026', exact=False).count() == 1
                  page.close()
              browser.close()
          print('Três filtros e vínculo exibido conferidos em 1440/390 px.')
          PY
          python scripts/qualidade/checar-margens.py "${RUNNER_TEMP}/astuti-alvo" 1440 390
