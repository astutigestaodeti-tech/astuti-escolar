name: Ensaio isolado de teclado e erros #318

on:
  push:
    branches: [qa/layout-fase2-290-292]

permissions:
  contents: read

jobs:
  renderizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: aca1dcc658de11610366cb19542031d33f590d14
            pr: '318'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_user
          POSTGRES_DB: postgres
          POSTGRES_USER: astuti_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astuti_ci -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLATFORM_DB_HOST: 127.0.0.1
      PLATFORM_DB_PORT: '5432'
      PLATFORM_DB_DATABASE: astuti_platform_test
      PLATFORM_DB_USERNAME: astuti_ci
      PLATFORM_DB_PASSWORD: ci_only_user
      TENANCY_INTEGRATION: '1'
      TENANCY_TEST_DB_HOST: 127.0.0.1
      TENANCY_TEST_DB_PORT: '5432'
      TENANCY_TEST_DB_A: astuti_tenant_a_test
      TENANCY_TEST_DB_B: astuti_tenant_b_test
      TENANCY_TEST_DB_USER: astuti_ci
      TENANCY_TEST_DB_PASSWORD: ci_only_user

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, gd, exif
          coverage: none

      - name: Preparar dados de teste
        shell: bash
        run: |
          for database in astuti_platform_test astuti_tenant_a_test astuti_tenant_b_test; do
            PGPASSWORD=ci_only_user psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U astuti_ci -d postgres -c "CREATE DATABASE $database WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"
          done
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force

      - name: Confirmar SHA e renderizar telas fictícias
        shell: bash
        env:
          TARGET_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "${RUNNER_TEMP}/astuti-telas"
          ASTUTI_DUMP_TELAS="${RUNNER_TEMP}/astuti-telas" php artisan test --filter=test_todas_as_telas_da_escola_abrem_para_a_direcao
          php artisan test --filter=GuardianWriteTest
          mkdir -p "${RUNNER_TEMP}/astuti-alvo"
          for name in resp_novo resp_editar resp_desvincular resp_novo_erro resp_editar_erro resp_desvincular_erro; do
            test -s "${RUNNER_TEMP}/astuti-telas/$name.html"
            cp "${RUNNER_TEMP}/astuti-telas/$name.html" "${RUNNER_TEMP}/astuti-alvo/"
          done
          echo "Telas renderizadas: $(find "${RUNNER_TEMP}/astuti-telas" -maxdepth 1 -type f -name '*.html' | wc -l)"
          find "${RUNNER_TEMP}/astuti-telas" -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sort

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir todas as margens em Chromium (1440 e 390 px)
        shell: bash
        run: |
          python -m pip install 'playwright==1.51.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root = Path(os.environ['RUNNER_TEMP'], 'astuti-alvo')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in (1440, 390):
                  for name, expected in (
                      ('resp_novo_erro', ['full_name', 'cpf', 'phone', 'relationship']),
                      ('resp_editar_erro', ['full_name', 'phone', 'relationship']),
                      ('resp_desvincular_erro', ['motivo']),
                  ):
                      page = browser.new_page(viewport={'width': width, 'height': 900})
                      page.goto((root / (name + '.html')).as_uri())
                      summary = page.locator('.formulario-aluno .erro[role="alert"]')
                      assert summary.count() == 1, name
                      page.wait_for_function("document.activeElement.matches('.formulario-aluno .erro[role=alert]')")
                      for field in expected:
                          control = page.locator(f'.formulario-aluno [name="{field}"]')
                          assert control.get_attribute('aria-invalid') == 'true', (name, field)
                          assert f'{field}-erro' in control.get_attribute('aria-describedby').split()
                          assert page.locator(f'#{field}-erro').is_visible()
                      first = expected[0]
                      page.keyboard.press('Tab')
                      assert page.evaluate('document.activeElement.name') == first, name
                      page.keyboard.press('Shift+Tab')
                      # O resumo é programaticamente focalizável, mas não entra na ordem normal de Tab.
                      page.locator(f'.formulario-aluno [name="{first}"]').focus()
                      page.keyboard.press('Control+a')
                      page.keyboard.type('Texto ficticio corrigido')
                      actual = page.locator(f'.formulario-aluno [name="{first}"]').input_value()
                      assert actual == 'Texto ficticio corrigido', (name, width, first, repr(actual))
                      page.close()
                  for name, first in [('resp_novo','full_name'), ('resp_editar','full_name'), ('resp_desvincular','motivo')]:
                      page = browser.new_page(viewport={'width': width, 'height': 900})
                      page.goto((root / (name + '.html')).as_uri())
                      assert page.locator('.formulario-aluno .erro[autofocus]').count() == 0
                      page.locator(f'.formulario-aluno [name="{first}"]').focus()
                      if name != 'resp_desvincular':
                          page.keyboard.press('Tab')
                          assert page.evaluate('document.activeElement.name') == 'cpf'
                          page.keyboard.press('Shift+Tab')
                          assert page.evaluate('document.activeElement.name') == first
                      page.close()
              browser.close()
          print('Criação, edição e desvínculo: foco, Tab, erros associados e edição pelo teclado conferidos em 1440/390 px.')
          PY
          python scripts/qualidade/checar-margens.py "${RUNNER_TEMP}/astuti-alvo" 1440 390
