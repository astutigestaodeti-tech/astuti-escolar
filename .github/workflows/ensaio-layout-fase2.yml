name: Ensaio isolado de importação ambígua #319

on:
  push:
    branches: [qa/layout-fase2-290-292]

permissions:
  contents: read

jobs:
  renderizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: c41401bf83bce04467944d4331b969ef0f8a7269
            pr: '319'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_user
          POSTGRES_DB: postgres
          POSTGRES_USER: astuti_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astuti_ci -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLATFORM_DB_HOST: 127.0.0.1
      PLATFORM_DB_PORT: '5432'
      PLATFORM_DB_DATABASE: astuti_platform_test
      PLATFORM_DB_USERNAME: astuti_ci
      PLATFORM_DB_PASSWORD: ci_only_user
      TENANCY_INTEGRATION: '1'
      TENANCY_TEST_DB_HOST: 127.0.0.1
      TENANCY_TEST_DB_PORT: '5432'
      TENANCY_TEST_DB_A: astuti_tenant_a_test
      TENANCY_TEST_DB_B: astuti_tenant_b_test
      TENANCY_TEST_DB_USER: astuti_ci
      TENANCY_TEST_DB_PASSWORD: ci_only_user

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, gd, exif
          coverage: none

      - name: Preparar dados de teste
        shell: bash
        run: |
          for database in astuti_platform_test astuti_tenant_a_test astuti_tenant_b_test; do
            PGPASSWORD=ci_only_user psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U astuti_ci -d postgres -c "CREATE DATABASE $database WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"
          done
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force

      - name: Confirmar SHA e renderizar telas fictícias
        shell: bash
        env:
          TARGET_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "${RUNNER_TEMP}/astuti-telas"
          ASTUTI_DUMP_TELAS="${RUNNER_TEMP}/astuti-telas" php artisan test --filter=ConfirmedStudentImportTest
          ASTUTI_DUMP_TELAS="${RUNNER_TEMP}/astuti-telas" php artisan test --filter=test_todas_as_telas_da_escola_abrem_para_a_direcao
          mkdir -p "${RUNNER_TEMP}/astuti-alvo"
          test -s "${RUNNER_TEMP}/astuti-telas/importacao_responsavel_ambiguo.html"
          cp "${RUNNER_TEMP}/astuti-telas/importacao_responsavel_ambiguo.html" "${RUNNER_TEMP}/astuti-alvo/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir todas as margens em Chromium (1440 e 390 px)
        shell: bash
        run: |
          python -m pip install 'playwright==1.51.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          target = Path(os.environ['RUNNER_TEMP'], 'astuti-alvo', 'importacao_responsavel_ambiguo.html')
          warning = 'Mais de um responsável corresponde ao nome e telefone. Nenhum vínculo será importado; confira na ficha.'
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in (1440, 390):
                  page = browser.new_page(viewport={'width': width, 'height': 900})
                  page.goto(target.as_uri())
                  row = page.locator('tr').filter(has_text='Ana Aluna Fictícia')
                  assert row.count() == 1, width
                  assert row.get_by_text(warning, exact=True).is_visible(), width
                  assert 'Maria Pessoa Fictícia' not in row.inner_text(), width
                  other = page.locator('tr').filter(has_text='Bruno Aluno Fictício')
                  assert other.count() == 1 and 'Maria Pessoa Fictícia' in other.inner_text(), width
                  assert warning not in other.inner_text(), width
                  page.close()
              browser.close()
          print('Aviso individual de ambiguidade e vínculo por CPF exato conferidos em 1440/390 px.')
          PY
          python scripts/qualidade/checar-margens.py "${RUNNER_TEMP}/astuti-alvo" 1440 390
