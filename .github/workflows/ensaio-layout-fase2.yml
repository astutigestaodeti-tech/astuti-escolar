name: Ensaio isolado de layout 299 após 295

on:
  push:
    branches: [qa/layout-fase2-290-292]

permissions:
  contents: read

jobs:
  renderizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: 26b4f2dc76d95d576fae672c0e17b8c253f52252
            pr: '299'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_user
          POSTGRES_DB: postgres
          POSTGRES_USER: astuti_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astuti_ci -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLATFORM_DB_HOST: 127.0.0.1
      PLATFORM_DB_PORT: '5432'
      PLATFORM_DB_DATABASE: astuti_platform_test
      PLATFORM_DB_USERNAME: astuti_ci
      PLATFORM_DB_PASSWORD: ci_only_user
      TENANCY_INTEGRATION: '1'
      TENANCY_TEST_DB_HOST: 127.0.0.1
      TENANCY_TEST_DB_PORT: '5432'
      TENANCY_TEST_DB_A: astuti_tenant_a_test
      TENANCY_TEST_DB_B: astuti_tenant_b_test
      TENANCY_TEST_DB_USER: astuti_ci
      TENANCY_TEST_DB_PASSWORD: ci_only_user

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, gd, exif
          coverage: none

      - name: Preparar dados de teste
        shell: bash
        run: |
          for database in astuti_platform_test astuti_tenant_a_test astuti_tenant_b_test; do
            PGPASSWORD=ci_only_user psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U astuti_ci -d postgres -c "CREATE DATABASE $database WITH TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'pt-BR';"
          done
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force

      - name: Confirmar SHA e renderizar formulários fictícios
        shell: bash
        env:
          TARGET_SHA: ${{ matrix.sha }}
          PR: ${{ matrix.pr }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "${RUNNER_TEMP}/astuti-telas" "${RUNNER_TEMP}/astuti-alvo"
          if [ "$PR" = 295 ]; then
            php artisan test --filter=test_nascimento_no_dia_atual_e_aceito_e_data_futura_e_recusada
          else
            node --test tests/Visual/postal-code-form.test.mjs
          fi
          ASTUTI_DUMP_TELAS="${RUNNER_TEMP}/astuti-telas" php artisan test --filter=test_todas_as_telas_da_escola_abrem_para_a_direcao
          for name in aluno_novo aluno_editar; do
            test -s "${RUNNER_TEMP}/astuti-telas/$name.html"
            cp "${RUNNER_TEMP}/astuti-telas/$name.html" "${RUNNER_TEMP}/astuti-alvo/"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aferir recuos reais com Chromium
        shell: bash
        env:
          PR: ${{ matrix.pr }}
        run: |
          python -m pip install 'playwright==1.51.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root = Path(os.environ['RUNNER_TEMP'], 'astuti-alvo')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for name in ('aluno_novo', 'aluno_editar'):
                  page = browser.new_page()
                  page.goto((root / (name + '.html')).as_uri())
                  assert page.locator('#birth_date').count() == 1
                  assert page.locator('label[for="birth_date"]').count() == 1
                  assert page.locator('#birth_date').get_attribute('type') == 'date'
                  if os.environ['PR'] == '299':
                      # Exercita a geometria do estado de mensagem; lógica dos eventos é testada em Node.
                      page.locator('#postal-lookup-status').evaluate("(el) => { el.textContent = 'Endereço encontrado. Confira os dados e complete o número, se necessário. Campos já preenchidos foram mantidos. Confira o endereço antes de gravar.'; }")
                      (root / (name + '_cep_aviso.html')).write_text(page.content(), encoding='utf-8')
                  page.close()
              browser.close()
          PY
          python scripts/qualidade/checar-margens.py "${RUNNER_TEMP}/astuti-alvo" 1440 390
